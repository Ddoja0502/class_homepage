<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 1-6 홈페이지</title>

  <style>
    boby {
        margin: 0;
        font-familt: Arial, sans-serif:
        background-color: #f5f7fb;
        color: #222;
    }
    header {
        background-color: #ffffff;
        padding: 25px 40px;
        border-bottom: 1px solid #ddd;
    }
    header h1 {
        margin: 8px 0 0;
        color: #777;
    }
    .container {
        max-width: 1000px;
        margin: 50px auto;
        padding: 0 20px;
    }
    .welcome {
        background-color: #ffffff;
        padding: 50px;
        border-radius: 20px;
        text-align: center;
        margin-bottom: 30px;
    }
    .welcome h2 {
        font-size: 36px;
        margin-bottom: 15px;
    }
    .welcome p {
        color: #666;
        font-size: 17px;
    }
    .menu {
        dispaly: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
    }
    .card {
        background-color: #ffffff;
        padding: 30px;
        border-radius: 18px;
        text-align: center;
        text-decoration: none;
        color: #222;
        border: 1px solid #eee;
    }
    .card:hover {
        transform: translateY(-3px);
    }
    .icon {
        font-size: 35px;
        margin-bottom: 10px;
    }
    .card h3 {
        margin: 10px 0;
    }
    .card p {
        color: #777;
        font-size: 14px;
    }
    
    @media (max-width: 700px) {
        .menu {
            grid-template-columns: 1fr;
        }
        .welcome {
            padding: 35px 20px;
        }
    }
  </style>
</head>

<body>

    <header>
        <h1>🏫 2026 1-6</h1>
        <p>학교 정보들을 한번에!</p>
    </header>

    <main class="container">

        <section class="welcome">
            <h2>WELCOME!🙌</h2>
            <p>1-6 홈페이지에 오신 것을 환영합니다</p>
            <p>공지사항, 일정, 학교정보와 같은 것을 확인해보세요</p>
        </section>

      <section class="menu">

          <a herf="notice.html" class="card">
              <div class="icon">📢</div>
              <h3>공지사항</h3>
              <p>우리 반의 소식을 확인하세요</p>
          </a>

          <a herf="#" class="card">
              <div class="icon">📆</div>
              <h3>일정</h3>
              <p>시험, 수행평가 등의 일정을 확인하세요</p>
          </a>

          <a herf="#" class="card">
              <div class="icon">📝</div>
              <h3>자료</h3>
              <p>학습 자료를 확인해보세요</p>
          </a>

          <a herf="#" class="card">
              <div class="icon">💡</div>
              <h3>익명 건의함</h3>
              <p>반에 원하는 것이나 하고싶은 말을 표현하세요</p>
          </a>

          <a herf="#" class="card">
              <div class="icon">ℹ️</div>
              <h3>학교정보</h3>
              <p>교무실 위치 등 학교정보를 확인하세요</p>
          </a>

      </section>

    </main>
  
</body>
</html>
